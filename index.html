<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="/scripts/theme-loader.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="newTabTitle">New Tab</title>

    <link rel="preconnect" href="https://api.open-meteo.com" />
    <link rel="preconnect" href="https://geocoding-api.open-meteo.com" />
    <link rel="preconnect" href="https://peapix.com" />
    <link rel="preconnect" href="https://duckduckgo.com" crossorigin />

    <link rel="preload" href="/src/style.scss" as="style" />
    <style>
      body {
        opacity: 0;
        background-color: #f9f9f9;
      }

      html[data-theme="dark"] body {
        background-color: #202020;
      }
    </style>
    <link rel="stylesheet" href="/src/style.scss" />
  </head>

  <body>
    <!-- Backgrounds and Animations -->
    <div class="cursor-blob"></div>

    <include src="src/icons/symbols.html" />

    <include src="src/html/components/app-launcher.html" />

    <div class="header-controls">
      <a
        href="#"
        id="weatherWidget"
        class="weather-widget"
        target="_blank"
        style="display: none"
      >
        <span class="weather-city" id="weatherCity">--</span>
        <div class="weather-icon" id="weatherIcon"></div>
        <span class="weather-temp" id="weatherTemp">--</span>
      </a>
      <include src="src/html/components/settings-popup.html" />
    </div>

    <div class="container">
      <div class="display-wrapper" style="display: none"></div>

      <form
        id="searchForm"
        action="#"
        method="GET"
        class="search-bar"
        style="display: none"
      >
        <div class="search-selector">
          <button type="button" id="engineBtn" class="current-engine-btn">
            <img
              id="currentEngineIcon"
              src="assets/search-engines/system.svg"
              alt="Search Engine"
            />
          </button>
          <div id="searchEngineTip" class="search-engine-tip is-hidden">
            <img src="assets/icons/tip.svg" alt="Tip" class="tip-icon" />
            <span data-i18n="searchEngineTip"
              >You can change the search engine here</span
            >
          </div>
          <div id="engineDropdown" class="dropdown-menu">
            <div class="dropdown-item" data-engine="system">
              <img
                src="assets/search-engines/system.svg"
                alt="System Default"
              />
              <span data-i18n="systemDefault">System Default</span>
            </div>
            <div class="dropdown-item" data-engine="bing">
              <img src="assets/search-engines/bing.svg" alt="Bing" />
              <span>Bing</span>
            </div>
            <div class="dropdown-item" data-engine="google">
              <img src="assets/search-engines/google.svg" alt="Google" />
              <span>Google</span>
            </div>
            <div class="dropdown-item" data-engine="brave">
              <img src="assets/search-engines/brave.svg" alt="Brave" />
              <span>Brave Search</span>
            </div>
            <div class="dropdown-item" data-engine="duck">
              <img src="assets/search-engines/ddg.svg" alt="DuckDuckGo" />
              <span>DuckDuckGo</span>
            </div>
            <div class="dropdown-item" data-engine="ecosia">
              <img src="assets/search-engines/ecosia.svg" alt="Ecosia Search" />
              <span>Ecosia Search</span>
            </div>
            <div class="dropdown-item" data-engine="startpage">
              <img src="assets/search-engines/startpg.svg" alt="Start Page" />
              <span>Start Page</span>
            </div>
            <div class="dropdown-item" data-engine="kagi">
              <img src="assets/search-engines/kagi.svg" alt="Kagi" />
              <span>Kagi</span>
            </div>
          </div>
        </div>

        <div class="divider"></div>

        <input
          type="text"
          name="q"
          id="searchInput"
          placeholder="Search the web"
          autocomplete="off"
          data-i18n="searchPlaceholder"
        />

        <button
          type="button"
          id="askAiBtn"
          class="ask-ai-btn"
          title="Ask AI"
          aria-label="Ask AI"
          style="display: none"
        >
          <svg
            class="ask-ai-icon-inactive"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M8.665 15.735c.245.173.537.265.836.264v-.004a1.44 1.44 0 0 0 1.327-.872l.613-1.864a2.87 2.87 0 0 1 1.817-1.812l1.778-.578a1.442 1.442 0 0 0-.052-2.74l-1.755-.57a2.88 2.88 0 0 1-1.822-1.823l-.578-1.777a1.446 1.446 0 0 0-2.732.022l-.583 1.792a2.88 2.88 0 0 1-1.77 1.786l-1.777.57a1.444 1.444 0 0 0 .017 2.735l1.754.569a2.89 2.89 0 0 1 1.822 1.826l.578 1.775c.099.283.283.527.527.7m-.374-4.25a4 4 0 0 0-.363-.413h.003a4.4 4.4 0 0 0-1.72-1.063l-1.6-.508 1.611-.524a4.4 4.4 0 0 0 1.69-1.065 4.45 4.45 0 0 0 1.041-1.708l.515-1.582.516 1.587a4.38 4.38 0 0 0 2.781 2.773l1.62.522-1.59.515a4.38 4.38 0 0 0-2.774 2.775l-.515 1.582-.515-1.585a4.4 4.4 0 0 0-.7-1.306m8.041 9.297a1.12 1.12 0 0 1-.41-.55l-.328-1.006a1.3 1.3 0 0 0-.821-.823l-.991-.323a1.15 1.15 0 0 1-.781-1.083 1.14 1.14 0 0 1 .771-1.08l1.006-.326a1.3 1.3 0 0 0 .8-.82l.324-.991a1.143 1.143 0 0 1 2.157-.021l.329 1.014a1.3 1.3 0 0 0 .82.816l.992.323a1.141 1.141 0 0 1 .039 2.165l-1.014.329a1.3 1.3 0 0 0-.818.822l-.322.989c-.078.23-.226.43-.425.57a1.14 1.14 0 0 1-1.328-.005m-1.03-3.783A2.8 2.8 0 0 1 17 18.708a2.8 2.8 0 0 1 1.7-1.7 2.81 2.81 0 0 1-1.718-1.708 2.8 2.8 0 0 1-1.682 1.699"
              fill="currentColor"
            />
          </svg>
          <svg
            class="ask-ai-icon-active"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            style="display: none"
          >
            <path
              d="M8.665 15.735c.245.173.537.265.836.264v-.004a1.44 1.44 0 0 0 1.327-.872l.613-1.864a2.87 2.87 0 0 1 1.817-1.812l1.778-.578a1.442 1.442 0 0 0-.052-2.74l-1.755-.57a2.88 2.88 0 0 1-1.822-1.823l-.578-1.777a1.446 1.446 0 0 0-2.732.022l-.583 1.792a2.88 2.88 0 0 1-1.77 1.786l-1.777.57a1.444 1.444 0 0 0 .017 2.735l1.754.569a2.89 2.89 0 0 1 1.822 1.826l.578 1.775c.099.283.283.527.527.7m7.667 5.047a1.12 1.12 0 0 1-.41-.55l-.328-1.006a1.3 1.3 0 0 0-.821-.823l-.991-.323a1.15 1.15 0 0 1-.781-1.083 1.14 1.14 0 0 1 .771-1.08l1.006-.326a1.3 1.3 0 0 0 .8-.82l.324-.991a1.143 1.143 0 0 1 2.157-.021l.329 1.014a1.3 1.3 0 0 0 .82.816l.992.323a1.141 1.141 0 0 1 .039 2.165l-1.014.329a1.3 1.3 0 0 0-.818.822l-.322.989c-.078.23-.226.43-.425.57a1.14 1.14 0 0 1-1.328-.005"
              fill="currentColor"
            />
          </svg>
        </button>

        <button
          type="button"
          id="voiceSearchBtn"
          class="voice-search-btn"
          title="Voice search"
          aria-label="Voice search"
        >
          <svg
            class="voice-search-icon-inactive"
            viewBox="-3 -2 24 24"
            xmlns="http://www.w3.org/2000/svg"
            fill="currentColor"
          >
            <path
              d="M9 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3m0-2a5 5 0 0 1 5 5v6a5 5 0 0 1-10 0V5a5 5 0 0 1 5-5M0 11.03a1 1 0 1 1 2 0A6.97 6.97 0 0 0 8.97 18h.06A6.97 6.97 0 0 0 16 11.03a1 1 0 1 1 2 0A8.97 8.97 0 0 1 9.03 20h-.06A8.97 8.97 0 0 1 0 11.03"
            />
          </svg>
          <svg
            class="voice-search-icon-active"
            viewBox="-3 -2 24 24"
            xmlns="http://www.w3.org/2000/svg"
            fill="currentColor"
            style="display: none"
          >
            <path
              d="M9 0a5 5 0 0 1 5 5v6a5 5 0 0 1-10 0V5a5 5 0 0 1 5-5M0 11.03a1 1 0 1 1 2 0A6.97 6.97 0 0 0 8.97 18h.06A6.97 6.97 0 0 0 16 11.03a1 1 0 1 1 2 0A8.97 8.97 0 0 1 9.03 20h-.06A8.97 8.97 0 0 1 0 11.03"
            />
          </svg>
        </button>

        <button type="submit" class="search-btn">
          <svg viewBox="0 0 24 24" width="24" height="24">
            <path
              d="M11.5 2.75a8.75 8.75 0 0 1 6.695 14.384l6.835 6.836a.75.75 0 0 1-.976 1.133l-.084-.073-6.836-6.835A8.75 8.75 0 1 1 11.5 2.75m0 1.5a7.25 7.25 0 1 0 0 14.5 7.25 7.25 0 0 0 0-14.5"
              fill="#5f6368"
            />
          </svg>
        </button>

        <div id="suggestionsContainer" class="suggestions-container"></div>
      </form>
      <div class="shortcuts-area">
        <div id="shortcutsGrid" class="shortcuts-grid"></div>
        <div id="folderBackWrapper" class="folder-back-wrapper">
          <button class="folder-back-btn" id="folderBackBtn">
            <svg
              width="12"
              height="12"
              viewBox="0 0 24 24"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M10.733 19.79a.75.75 0 0 0 1.034-1.086L5.516 12.75H20.25a.75.75 0 0 0 0-1.5H5.516l6.251-5.955a.75.75 0 0 0-1.034-1.086l-7.42 7.067a1 1 0 0 0-.3.58.8.8 0 0 0 .001.289 1 1 0 0 0 .3.579l7.419 7.067Z"
                fill="currentColor"
              />
            </svg>
            <span class="folder-back-label" data-i18n="backLabel">Back</span>
          </button>
        </div>
      </div>
    </div>

    <include src="src/html/components/feed-drawer.html" />

    <include src="src/html/templates/modals.html" />

    <div id="wallpaperCredits" class="wallpaper-credits hidden">
      <svg
        width="20"
        height="20"
        fill="none"
        viewBox="0 0 24 24"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M13.925 2.503a2.25 2.25 0 0 1 1.94 1.11L16.679 5h2.071A3.25 3.25 0 0 1 22 8.25v9.5A3.25 3.25 0 0 1 18.75 21H5.25A3.25 3.25 0 0 1 2 17.75v-9.5A3.25 3.25 0 0 1 5.25 5h2.08l.875-1.424a2.25 2.25 0 0 1 1.917-1.073h3.803Zm0 1.5h-3.803a.75.75 0 0 0-.574.268l-.065.09L8.39 6.141a.75.75 0 0 1-.639.358h-2.5A1.75 1.75 0 0 0 3.5 8.25v9.5c0 .966.784 1.75 1.75 1.75h13.5a1.75 1.75 0 0 0 1.75-1.75v-9.5a1.75 1.75 0 0 0-1.75-1.75h-2.5a.75.75 0 0 1-.647-.37l-1.032-1.757a.75.75 0 0 0-.646-.37ZM12 8a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9Zm0 1.5a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z"
          fill="#ffffff"
        />
      </svg>
      <span id="wallpaperCreditText"></span>
    </div>

    <div
      id="fluent-select-popup"
      class="fluent-select-popup"
      aria-hidden="true"
    >
      <ul class="fluent-select-options-list" role="listbox"></ul>
    </div>

    <script type="module" src="/scripts/i18n.js"></script>
    <script type="module" src="/src/core/boot/main.ts"></script>
  </body>
</html>
