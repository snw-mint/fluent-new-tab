name: Publish to Web Stores

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish-stores:
    runs-on: ubuntu-latest

    steps:
      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Download release assets
        uses: robinraju/release-downloader@v1.11
        with:
          tag: ${{ github.event.release.tag_name }}
          fileName: '*'

      - name: Publish to Microsoft Edge Add-ons
        uses: PlasmoHQ/bpp@v3
        with:
          edge-product-id: ${{ secrets.EDGE_PRODUCT_ID }}
          edge-client-id: ${{ secrets.EDGE_CLIENT_ID }}
          edge-client-secret: ${{ secrets.EDGE_CLIENT_SECRET }}
          edge-access-token-url: ${{ secrets.EDGE_ACCESS_TOKEN_URL }}
          edge-zip: 'fluent-new-tab-v${{ steps.version.outputs.VERSION }}.zip'

      - name: Publish to Firefox Add-ons (AMO)
        uses: PlasmoHQ/bpp@v3
        with:
          firefox-jwt-issuer: ${{ secrets.FIREFOX_JWT_ISSUER }}
          firefox-jwt-secret: ${{ secrets.FIREFOX_JWT_SECRET }}
          firefox-zip: 'fluent-new-tab-v${{ steps.version.outputs.VERSION }}-firefox.zip'
