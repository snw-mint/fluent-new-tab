name: Publish to Web Stores

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish-stores:
    runs-on: ubuntu-latest

    steps:
      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Download release assets
        uses: robinraju/release-downloader@v1.11
        with:
          tag: ${{ github.event.release.tag_name }}
          fileName: '*'

      - name: Publish to Web Stores
        uses: PlasmoHQ/bpp@v3
        with:
          keys: |
            {
              "edge": {
                "productId": "${{ secrets.EDGE_PRODUCT_ID }}",
                "clientId": "${{ secrets.EDGE_CLIENT_ID }}",
                "clientSecret": "${{ secrets.EDGE_CLIENT_SECRET }}",
                "accessTokenUrl": "${{ secrets.EDGE_ACCESS_TOKEN_URL }}"
              },
              "firefox": {
                "apiKey": "${{ secrets.FIREFOX_JWT_ISSUER }}",
                "apiSecret": "${{ secrets.FIREFOX_JWT_SECRET }}"
              }
            }
          edge-file: 'fluent-new-tab-v${{ steps.version.outputs.VERSION }}.zip'
          firefox-file: 'fluent-new-tab-v${{ steps.version.outputs.VERSION }}-firefox.zip'
